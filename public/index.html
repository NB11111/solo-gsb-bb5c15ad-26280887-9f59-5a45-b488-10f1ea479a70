<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发言席位</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================= 首页：创建 / 加入 ================= -->
  <section id="view-home" class="view">
    <div class="home-card">
      <h1 class="logo">🎙️ 发言席位</h1>
      <p class="subtitle">线下讨论 · 排队发言 · 投屏展示</p>

      <div class="home-block">
        <h2>创建房间（主持人）</h2>
        <form id="form-create" class="home-form">
          <input type="text" id="create-nick" maxlength="20" placeholder="主持人昵称（可选，默认「主持人」）" />
          <button type="submit" class="btn btn-primary btn-lg">创建房间</button>
        </form>
      </div>

      <div class="home-divider"><span>或</span></div>

      <div class="home-block">
        <h2>加入房间（参与者）</h2>
        <form id="form-join" class="home-form">
          <input type="text" id="join-room" maxlength="6" inputmode="numeric"
                 placeholder="6 位房间码" autocomplete="off" required />
          <input type="text" id="join-nick" maxlength="20" placeholder="你的昵称" autocomplete="off" required />
          <button type="submit" class="btn btn-secondary btn-lg">加入房间</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= 房间 ================= -->
  <section id="view-room" class="view hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">🎙️ 发言席位</span>
        <span class="room-code" title="点击复制房间码" id="room-code">------</span>
        <span class="host-badge" id="host-badge">主持人</span>
        <button class="btn btn-mini" id="btn-copy-link" type="button">复制邀请链接</button>
      </div>
      <div class="topbar-right">
        <span class="version-badge" id="version-badge">v0</span>
        <span class="conn-dot" id="conn-dot" title="连接状态"></span>
        <span class="conn-text" id="conn-text">连接中…</span>
        <button class="btn btn-mini btn-ghost" id="btn-exit" type="button">退出房间</button>
      </div>
    </header>

    <main class="room-grid">
      <!-- 当前发言 -->
      <div class="panel panel-stage">
        <div class="panel-title">当前发言</div>
        <div class="stage" id="stage">
          <div class="stage-idle" id="stage-idle">
            <span class="stage-idle-emoji">🕊️</span>
            <span>暂无发言人</span>
          </div>
          <div class="stage-active hidden" id="stage-active">
            <div class="stage-nick" id="stage-nick"></div>
            <div class="stage-timer" id="stage-timer">00:00</div>
            <div class="stage-countdown hidden" id="stage-countdown"></div>
            <div class="stage-actions" id="stage-actions-host">
              <button class="btn btn-danger btn-lg" id="btn-end" type="button">结束发言</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 发言队列 -->
      <div class="panel panel-queue">
        <div class="panel-title">
          发言队列 <span class="count" id="queue-count">0</span>
          <span class="hint host-only" id="reorder-hint">（拖动调整顺序）</span>
          <label class="duration-picker host-only" title="开始发言时的限时时长（到期自动结束）">
            限时
            <select id="speak-duration">
              <option value="">不限时</option>
            </select>
          </label>
          <button class="btn btn-primary btn-mini host-only rollcall-start-btn" id="btn-rollcall-start"
                  type="button" title="按队列顺序逐一点名，每人 20 秒确认">📢 点名接力</button>
        </div>

        <!-- 队首点名接力：倒计时、当前对象与本人操作 -->
        <div class="rollcall-bar" id="rollcall-bar" hidden>
          <div class="rollcall-info">
            <span class="rollcall-tag">点名接力</span>
            <span class="rollcall-target">正在点名：<b id="rollcall-target-name">—</b></span>
            <span class="rollcall-countdown" id="rollcall-countdown">20</span>
            <span class="rollcall-progress" id="rollcall-progress"></span>
          </div>
          <div class="rollcall-actions" id="rollcall-actions-me">
            <button class="btn btn-primary btn-mini" id="btn-rollcall-confirm" type="button">✅ 我确认，开始发言</button>
            <button class="btn btn-ghost btn-mini" id="btn-rollcall-skip" type="button">⏭ 跳过（移到队尾）</button>
          </div>
          <div class="rollcall-actions host-only" id="rollcall-actions-host">
            <button class="btn btn-danger btn-mini" id="btn-rollcall-cancel" type="button">取消点名</button>
          </div>
        </div>

        <!-- 议题投票卡：主持人发起议题并设定截止时间；成员在截止前投一票（可改票），到点自动结算 -->
        <div class="vote-card" id="vote-card">
          <div class="vote-head">
            <span class="vote-head-title">🗳️ 议题投票</span>
            <span class="vote-status-tag hidden" id="vote-status-tag">投票中</span>
            <span class="vote-countdown hidden" id="vote-countdown"></span>
          </div>

          <div class="vote-empty" id="vote-empty">暂无议题，等待主持人发起投票</div>

          <div class="vote-body hidden" id="vote-body">
            <div class="vote-title" id="vote-title"></div>
            <div class="vote-counts">
              <div class="vote-count is-for"><b id="vote-count-for">0</b><span>赞成</span></div>
              <div class="vote-count is-against"><b id="vote-count-against">0</b><span>反对</span></div>
              <div class="vote-count is-abstain"><b id="vote-count-abstain">0</b><span>弃权</span></div>
            </div>
            <div class="vote-meta" id="vote-meta"></div>
            <div class="vote-result hidden" id="vote-result"></div>
            <div class="vote-actions hidden" id="vote-actions">
              <button class="btn vote-btn vote-btn-for" data-choice="for" type="button">👍 赞成</button>
              <button class="btn vote-btn vote-btn-against" data-choice="against" type="button">👎 反对</button>
              <button class="btn vote-btn vote-btn-abstain" data-choice="abstain" type="button">✋ 弃权</button>
            </div>
            <div class="vote-host-actions host-only" id="vote-host-actions">
              <button class="btn btn-danger btn-mini" id="btn-vote-end" type="button">结束并结算</button>
            </div>
          </div>

          <form class="vote-create host-only hidden" id="form-vote-create">
            <input type="text" id="vote-title-input" maxlength="60"
                   placeholder="输入议题标题（如：是否采纳方案 A）" autocomplete="off" />
            <div class="vote-create-row">
              <select id="vote-duration" title="投票时长，到点自动结算">
                <option value="30">30 秒</option>
                <option value="60" selected>1 分钟</option>
                <option value="120">2 分钟</option>
                <option value="180">3 分钟</option>
                <option value="300">5 分钟</option>
                <option value="600">10 分钟</option>
              </select>
              <button type="submit" class="btn btn-primary">🗳️ 发起投票</button>
            </div>
          </form>
        </div>

        <ul class="queue-list" id="queue-list"></ul>
        <div class="queue-empty" id="queue-empty">队列为空，等待申请发言</div>

        <!-- 安全撤销：主持人最近一次可撤销操作的摘要 / 失效原因 -->
        <div class="undo-bar host-only" id="undo-bar" hidden></div>

        <!-- 协商换位：我发起 / 我收到的待处理邀请 -->
        <div class="swap-bar participant-only" id="swap-bar"></div>

        <div class="queue-actions participant-only">
          <button class="btn btn-primary btn-lg" id="btn-request" type="button">🙋 申请发言</button>
          <button class="btn btn-secondary btn-lg hidden" id="btn-cancel" type="button">取消申请</button>
        </div>
      </div>

      <!-- 右侧：记录 + 成员 -->
      <div class="panel panel-side panel-logs">
        <div class="panel-title">
          操作记录
          <button class="btn btn-mini btn-ghost host-only" id="btn-clear-logs" type="button">清空记录</button>
        </div>
        <ul class="log-list" id="log-list"></ul>
      </div>

      <div class="panel panel-side panel-people">
        <div class="panel-title">
          在场成员 <span class="count" id="people-count">0</span>
          <button class="btn btn-mini btn-danger host-only" id="btn-clear-all" type="button">一键清空</button>
        </div>
        <ul class="people-list" id="people-list"></ul>
      </div>
    </main>
  </section>

  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
